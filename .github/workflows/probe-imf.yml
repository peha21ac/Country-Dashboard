name: Probe IMF API (temporary diagnostic)
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe-imf.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try candidate IMF URLs
        run: |
          B=https://www.imf.org/external/datamapper/api
          for u in \
            "$B/v1/indicators" "$B/v2/indicators" \
            "$B/v1/NGDP_RPCH/CIV" "$B/v2/NGDP_RPCH/CIV" \
            "$B/v1/NGDP_RPCH/CIV/" "$B/v2/NGDP_RPCH/CIV/" \
            "$B/v1/NGDP_RPCH/FRA" "$B/v2/NGDP_RPCH/FRA" \
            "$B/v1/NGDP_RPCH" "$B/v2/NGDP_RPCH" \
            "$B/v2/NGDP_RPCH/CIV?periods=2023,2024,2025" \
            "$B/v2/countries"; do
            for ua in "civ-peg-dashboard/1.0" "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"; do
              code=$(curl -s -m 30 -A "$ua" -o /tmp/body -w "%{http_code} %{content_type}" "$u")
              echo "[$code] ${ua:0:12} $u :: $(head -c 140 /tmp/body | tr '\n' ' ')"
            done
          done
