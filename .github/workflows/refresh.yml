name: Refresh data and deploy

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      degraded: ${{ steps.refresh.outputs.degraded }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Fetch, validate, derive, export
        id: refresh
        run: python -m pipeline.build
      - name: Commit refreshed data (keeps last good values between runs)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No data changes"; else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verdict:
    # The site is deployed even when degraded; this job turns the run red so the owner is notified.
    needs: [build, deploy]
    if: needs.build.outputs.degraded == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::One or more series failed to refresh. The site shows them as stale or unavailable. See the 'Fetch, validate, derive, export' log."
          exit 1
